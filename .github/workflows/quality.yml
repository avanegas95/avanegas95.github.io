name: quality

# Internal PR gates for feat/blob (CLAUDE.md rules 5, 7, 8, 12). Nothing here deploys or
# publishes: results are artifacts only, no secrets are referenced, and the real Anthropic API
# is never called (E2E intercepts /api/chat; unit tests mock the SDK).
#
# Pushes to feat/blob run the fast tier: everything except firefox/webkit E2E and Lighthouse.
# Pull requests and manual runs (`gh workflow run quality --ref feat/blob`) run the full tier,
# which is the rule 8 gate.
#
# Parallel jobs: checks start at once; unit, E2E (one job per browser) and Lighthouse start as
# soon as the single build is done, and reuse its output. Wall time is setup + the slowest
# job, not the sum.
on:
  pull_request:
  push:
    branches: [feat/blob]
  workflow_dispatch:

# Pushes: one group per SHA, so a later commit never cancels an earlier commit's run.
# Pull requests: one group per PR, newer pushes cancel the stale run.
concurrency:
  group: quality-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Build
        run: npm run build

      # The site for E2E and Lighthouse, and the outputs the unit tests inspect.
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .vercel/output/
            dist/
          include-hidden-files: true
          retention-days: 1

  checks:
    name: Lint, typecheck and voice lock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Visibility, not the gate: any voice.lock.json change in the pushed range
      # or PR is printed as annotations and in the job summary.
      - name: Voice lock changes
        if: always()
        run: >
          node scripts/ci/voice-lock-annotate.ts
          "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      # Blocking: locked prose must match voice.lock.json. Red here is intended
      # until Anderson accepts the change himself.
      - name: Voice lock check
        if: always()
        shell: bash
        run: |
          if ! npm run voice:check; then
            {
              echo '### voice:check failed'
              echo 'Locked prose differs from voice.lock.json. Run `npm run voice:accept` in your own terminal, then commit voice.lock.json.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Non-blocking until P5.5-04/05/06 fix the known findings.
      - name: Facts check (report only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          node scripts/facts-check.ts | tee facts.txt
          code=${PIPESTATUS[0]}
          { echo '### facts:check'; echo '```'; cat facts.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  unit:
    name: Unit tests, bundle and PII guard
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      # Needs the build: the CSP-hash and build-output tests skip without one.
      - name: Unit tests
        run: npm test

      - name: Client bundle check
        if: always()
        run: npm run check:bundle

      - name: PII guard
        if: always()
        run: npm run guard:pii

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image ships the browsers and their system packages, so no
    # apt install runs (GitHub's Ubuntu mirror stalled it three times). The tag
    # must match @playwright/test in package.json; a unit test keeps them equal.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when HOME isn't owned by the container user.
      HOME: /root
    strategy:
      fail-fast: false
      matrix:
        # Fast tier: chromium only. Full tier: chromium, firefox and webkit.
        browser: ${{ fromJSON(github.event_name == 'push' && '["chromium"]' || '["chromium","firefox","webkit"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: E2E (includes axe)
        # WebKit timed out on networkidle with 4 workers on the 4-vCPU runner; it
        # gets 2 (as before), chromium and firefox the config's 4.
        run: npm run test:e2e -- --project=${{ matrix.browser }} ${{ matrix.browser == 'webkit' && '--workers=2' || '' }}
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  lighthouse:
    name: Lighthouse
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Playwright's own image ships the browsers and their system packages, so no
    # apt install runs (GitHub's Ubuntu mirror stalled it three times). The tag
    # must match @playwright/test in package.json; a unit test keeps them equal.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      # Firefox refuses to start when HOME isn't owned by the container user.
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Lighthouse
        run: |
          export CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm run lhci

      - name: Lighthouse summary
        if: always()
        run: node scripts/ci/summary.mjs

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lhci-results
          path: reports/lhci/
          if-no-files-found: ignore

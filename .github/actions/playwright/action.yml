name: Playwright browser
description: Installs one Playwright browser, with its download cached by Playwright version.
inputs:
  browser:
    description: chromium, firefox or webkit
    required: true
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: echo "pw=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.pw }}-${{ inputs.browser }}

    # The browser download comes from the cache; the system packages still come
    # from apt (~20 s). Composite steps can't time out on their own, so the
    # jobs using this keep a short timeout (a stalled apt mirror once hung 27 min).
    - name: Install Playwright browsers
      shell: bash
      run: npx playwright install --with-deps ${{ inputs.browser }}
